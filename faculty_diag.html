
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Faculty Diagnostic Gateway - LPHU</title>
  <style>
    body { font-family: 'Courier New', monospace; background: #0f172a; color: #38bdf8; margin: 0; padding: 2rem; }
    .container { max-width: 800px; margin: auto; background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 2rem; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h1 { color: #f8fafc; font-size: 1.5rem; margin-bottom: 0.5rem; }
    p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 1.5rem; }
    .input-group { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
    input { flex: 1; padding: 0.75rem; background: #0f172a; border: 1px solid #475569; color: #f8fafc; border-radius: 4px; font-family: inherit; }
    button { padding: 0.75rem 1.5rem; background: #0284c7; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background: #0369a1; }
    #consoleOutput { background: #050b14; border: 1px solid #1e293b; border-radius: 4px; padding: 1rem; white-space: pre-wrap; word-wrap: break-word; font-size: 0.85rem; color: #4ade80; display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>LPHU Internal Node Gateway [Faculty Diagnostic]</h1>
    <p>Network Diagnostic Utility — Input Target IP for Latency Verification</p>
    <div class="input-group">
      <input type="text" id="targetInput" placeholder="127.0.0.1" value="127.0.0.1">
      <button onclick="runDiag()">Test Connectivity</button>
    </div>
    <div id="consoleOutput"></div>
  </div>

  <script>
    function runDiag() {
      const input = document.getElementById('targetInput').value.trim();
      const out = document.getElementById('consoleOutput');
      out.style.display = 'block';

      // Hardened WAF: Block spaces, semicolons, and the 'cat' binary
      if (input.includes(' ') || input.includes(';') || input.toLowerCase().includes('cat')) {
        out.innerHTML = `<span style="color:#ef4444; font-weight:bold;">[SECURITY ALERT] WAF: Malicious Characters Detected!\nFLAG 1.2: FLAG{waf_blacklist_signature_hit}</span>`;
        return;
      }

      const pingHeader = `PING 127.0.0.1 (127.0.0.1) 56(84) bytes of data.\n64 bytes from 127.0.0.1: icmp_seq=1 ttl=64 time=0.032 ms\n\n--- 127.0.0.1 ping statistics ---\n1 packets transmitted, 1 received, 0% packet loss\n`;

      if (input.includes('&&') || input.includes('||')) {
        const cmd = input.replace(/\$\{IFS\}/g, ' ');

        if (cmd.includes('env') || cmd.includes('printenv')) {
          out.innerHTML = `${pingHeader}\nPATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin\nCHALLENGE_FLAG=FLAG{env_variable_exfiltration_done}\nUSER=www-data`;
        } else if (cmd.includes('/etc/issue') || cmd.includes('/proc/version')) {
          out.innerHTML = `${pingHeader}\nUbuntu 22.04.3 LTS \\n \\l - FLAG{os_release_info_harvested}`;
        } else if (cmd.includes('ps')) {
          out.innerHTML = `${pingHeader}\nroot  1241  0.0  0.1  /bin/bash /opt/backup.sh --token=FLAG{cron_task_process_spotted}\nwww-data  1420  0.0  0.2  apache2`;
        } else if (cmd.includes('ls') && (cmd.includes('.secret_core') || cmd.includes('/var/www'))) {
          out.innerHTML = `${pingHeader}\ntotal 16\ndrwxr-x--- 2 www-data www-data 4096 Sep 4 12:00 .secret_core\nFLAG 1.6: FLAG{hidden_secret_core_located}`;
        } else if ((cmd.includes('tac') || cmd.includes('more') || cmd.includes('nl')) && cmd.includes('flag1.txt')) {
          out.innerHTML = `${pingHeader}\n[OUTPUT]:\n{blue_stuff}`;
        } else {
          out.innerHTML = `${pingHeader}\nCommand executed successfully.`;
        }
      } else {
        out.innerHTML = `PING ${input} (${input}) 56(84) bytes of data.\n64 bytes from ${input}: icmp_seq=1 ttl=64 time=0.035 ms\n\n--- ${input} ping statistics ---\n1 packets transmitted, 1 received, 0% packet loss`;
      }
    }
  </script>
</body>
</html>
